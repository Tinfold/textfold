[package]
name = "textfold"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
ignore = "0.4.33"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
ropey = "1.6.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

tree-sitter = "0.26.12"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.3"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-yaml = "0.7.2"
libloading = "0.9.0"
tree-sitter-typescript = "0.23.2"
base64 = "0.23.1"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-java = "0.23.5"
tree-sitter-containerfile = "0.9.2"

# Dependencies are built with optimisation even in a debug build. Half of
# textfold's work happens inside tree-sitter's C, and at -O0 that is slow
# enough to be mistaken for a hang on a large file — which is not a useful
# thing to be debugging.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
lto = true
codegen-units = 1
