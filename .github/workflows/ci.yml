# What a pull request has to survive: it builds, the tests pass, and clippy has
# nothing to say. Formatting is deliberately not checked — the source is
# hand-set in places rustfmt would undo, and a robot rewriting a comment block
# it does not understand is not an improvement.

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: The toolchain the crate asks for
        run: rustup toolchain install stable --profile minimal --component clippy

      # The grammars are C and are compiled in, so a cold build is minutes.
      # Keyed on the lockfile: the dependencies are what takes the time, and
      # they only change when it does.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      - run: cargo build --locked --all-targets
      - run: cargo test --locked
      # A build that warns is a build on its way to breaking — but only ours.
      # As `RUSTFLAGS` this would be handed to the dependencies as well, and a
      # new compiler warning in somebody else's crate is not a reason for this
      # to go red. Clippy runs the compiler's own lints too, so nothing is lost
      # by asking here rather than everywhere.
      - run: cargo clippy --locked --all-targets -- -D warnings
